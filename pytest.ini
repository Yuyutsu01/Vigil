[pytest]
testpaths = tests
pythonpath = backend
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short -v
markers =
    timeout: mark test execution timeout
    needs_real_redis: mark test as requiring a real Redis instance

[coverage:run]
source = backend/app
branch = true
omit =
    */migrations/*
    */__pycache__/*

[coverage:report]
show_missing = true
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if TYPE_CHECKING:
