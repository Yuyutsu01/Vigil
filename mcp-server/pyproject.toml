[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil-mcp"
version = "1.0.0"
description = "Vigil Model Context Protocol (MCP) Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0"
]

[project.scripts]
vigil-mcp = "vigil_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
