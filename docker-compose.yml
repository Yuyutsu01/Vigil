services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vigil_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil
      POSTGRES_DB: vigil
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil -d vigil"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vigil_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vigil_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://vigil:vigil@postgres:5432/vigil"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-CHANGE_ME_IN_PRODUCTION}"
      VIGIL_ENV: "${VIGIL_ENV:-development}"
      VIGIL_LLM_PROVIDER: "${VIGIL_LLM_PROVIDER:-mock}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      VIGIL_CORS_ORIGINS: "http://localhost:3000"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_APP_SLUG: "${GITHUB_APP_SLUG:-}"
      GITHUB_APP_PRIVATE_KEY_PATH: "${GITHUB_APP_PRIVATE_KEY_PATH:-/app/secrets/github-app.pem}"
      GITHUB_APP_WEBHOOK_SECRET: "${GITHUB_APP_WEBHOOK_SECRET:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
    ports:
      - "8000:8000"
    volumes:
      - ./secrets:/app/secrets:ro
      - ./prompts:/prompts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Webhook ARQ Worker (Phase 3, B4) ───────────────────────────────────────
  webhook_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vigil_webhook_worker
    restart: unless-stopped
    command: ["arq", "app.integrations.github.webhook_worker.WorkerSettings"]
    environment:
      DATABASE_URL: "postgresql+asyncpg://vigil:vigil@postgres:5432/vigil"
      REDIS_URL: "redis://redis:6379/0"
      VIGIL_ENV: "${VIGIL_ENV:-development}"
      VIGIL_LLM_PROVIDER: "${VIGIL_LLM_PROVIDER:-mock}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_APP_SLUG: "${GITHUB_APP_SLUG:-}"
      GITHUB_APP_PRIVATE_KEY_PATH: "${GITHUB_APP_PRIVATE_KEY_PATH:-/app/secrets/github-app.pem}"
      GITHUB_APP_WEBHOOK_SECRET: "${GITHUB_APP_WEBHOOK_SECRET:-}"
    volumes:
      - ./secrets:/app/secrets:ro
      - ./prompts:/prompts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vigil_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
